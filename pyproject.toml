[project]
name = "arm-control"
version = "1.0.0"
description = "Numerical verification, controllability analysis, and closed-loop simulation for a 2-DOF planar robotic arm"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Andrew Abdelmalak" },
]
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
]

[project.scripts]
arm-control = "arm_control.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arm_control"]

[tool.uv]
exclude-newer = "2026-10-31T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
