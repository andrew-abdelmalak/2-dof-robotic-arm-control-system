<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="sp-title sp-desc">
  <title id="sp-title">2-DOF Robotic Arm Control System</title>
  <desc id="sp-desc">Computed-torque feedback linearization, Lie-bracket controllability, Simulink Stateflow, and Arduino/ESP32 firmware.</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg-grad)"/>
  <rect x="0" y="0" width="16" height="640" fill="#38BDF8"/>

  <!-- Subtle geometric 2-DOF planar arm illustration on the right -->
  <g transform="translate(940, 320)" opacity="0.92">
    <circle cx="0" cy="0" r="190" fill="none" stroke="#1E3A5F" stroke-width="2" stroke-dasharray="8 8"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#0EA5E9" stroke-width="1.5" opacity="0.35"/>
    <!-- Base joint -->
    <line x1="0" y1="0" x2="118" y2="-96" stroke="#38BDF8" stroke-width="14" stroke-linecap="round"/>
    <line x1="118" y1="-96" x2="215" y2="-10" stroke="#22D3EE" stroke-width="11" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="18" fill="#0F172A" stroke="#38BDF8" stroke-width="5"/>
    <circle cx="118" cy="-96" r="14" fill="#0F172A" stroke="#38BDF8" stroke-width="4"/>
    <circle cx="215" cy="-10" r="10" fill="#10B981"/>
  </g>

  <!-- Project badge -->
  <rect x="80" y="96" width="400" height="40" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="280" y="122" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="18" font-weight="600" fill="#38BDF8">MECHATRONICS · NONLINEAR CONTROL</text>

  <!-- Main Title -->
  <text x="80" y="236"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="76" font-weight="800" fill="#F8FAFC">2-DOF Robotic Arm</text>
  <text x="80" y="324"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="68" font-weight="700" fill="#38BDF8">Control System</text>

  <!-- Tagline -->
  <text font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="32" font-weight="400" fill="#CBD5E1">
    <tspan x="80" y="400">Computed-torque feedback linearization, Lie-bracket</tspan>
    <tspan x="80" y="448">controllability, Simulink Stateflow, and Arduino C++</tspan>
  </text>

  <!-- Repo URL -->
  <text x="80" y="544"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="26" fill="#38BDF8">github.com/andrew-abdelmalak/2-dof-robotic-arm-control-system</text>
</svg>
