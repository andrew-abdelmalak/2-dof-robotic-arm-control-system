name: Bug report
description: Report a bug in the Python verification package, Octave/MATLAB scripts, Arduino firmware, or documentation.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For security problems, follow SECURITY.md instead of opening a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal commands or sketch/script steps to reproduce the issue.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or release tag
      description: Output of `git rev-parse --short HEAD` or the release tag (e.g., v1.0.0).
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python/uv version, Octave/MATLAB version, or Arduino board/core version.
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste relevant terminal or compiler output.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
